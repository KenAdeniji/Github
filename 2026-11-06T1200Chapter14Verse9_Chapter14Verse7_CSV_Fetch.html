	<head>
		<title>CSV PapaParse</title>
		<meta charset="UTF-8"/>
		<meta name="description" content="CSV PapaParse"/>
		<meta name="keyword" content="CSV, Parser"/>
		<meta name="robots" content="index, follow"/>
		<meta name="author" content="Ken Adeniji"/>
		<style>
			html, body{
			  height: 100%;
			  width: 100%;
			}
			textarea{ //viewport
				height: 100vh;
				width: 100vw;
			}
		</style>	
	</head>
	<body>
		<div align="center">
			<textarea id="resultSet" align="left"></textarea>
		</div>
		<script>
			const 	resultSetElement = document.getElementById("resultSet");
			
			function pageLoad()
			{
				fetchCSV()
 			}

			async function fetchCSV() {
			  const response = await fetch(CSVFilename);
			  if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
			  const text = await response.text();
			  
			  // Parse lines manually or use a library like Papa Parse
			  const rows = text.trim().split('\n');
			  const headers = rows[0].split(',');
			  const data = rows.slice(1).map(row => {
				const values = row.split(',');
				return headers.reduce((acc, header, index) => {
				  acc[header.trim()] = values[index]?.trim();
				  return acc;
				}, {});
			  });

			  console.log(data);
			  resultSetElement.value = headers + data;
			  
			}

			window.addEventListener("load", pageLoad, false);

			const CSVFilename = "../2026-11-03Chapter14Verse9_Chapter14Verse7.csv"
			//const CSVFilename = "https://kenadeniji.github.io/Github/2026-11-03Chapter14Verse9_Chapter14Verse7.csv"
		</script>		
	</body>
